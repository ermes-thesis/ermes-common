services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning --requirepass eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81
    volumes:
      - redis:/data

  go:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/ermes-wasm-test:cached
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    depends_on:
      - redis
    command: sleep infinity

volumes:
  redis:
    driver: local
