name: ermes-wasm-test

services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning --requirepass eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81
    volumes:
      - redis:/data
    networks:
      - dev-net

  go:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/ermes-wasm-test:cached
      - gocache:/go/pkg/mod  # Go module cache persistente
      - gocachebin:/root/.cache/go-build # cache di compilazione
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    depends_on:
      - redis
    working_dir: /workspaces/ermes-wasm-test
    command: sleep infinity
    networks:
      - dev-net

volumes:
  redis:
    driver: local
  gocache:
    driver: local
  gocachebin:
    driver: local

networks:
  dev-net:
    attachable: true