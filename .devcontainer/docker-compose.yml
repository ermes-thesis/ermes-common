name: ermes-wasm-pool

services:
  go:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/workspaces/ermes-wasm-pool:cached
      - gocache:/go/pkg/mod  # Go module cache persistente
      - gocachebin:/root/.cache/go-build # cache di compilazione
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    working_dir: /workspaces/ermes-wasm-pool
    command: go test github.com/ermes-thesis/ermes-wasm-pool/test

volumes:
  gocache:
    driver: local
  gocachebin:
    driver: local